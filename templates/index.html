<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国古典文学问答系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .answer-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .source-tag {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 5px 15px;
        }
        .category-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .history-item {
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover {
            background: #f8f9fa;
        }
        .loading-spinner {
            display: none;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-book-open"></i> 中国古典文学问答系统
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="#knowledge">知识库</a>
                <a class="nav-link" href="#about">关于</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <!-- 左侧问答区域 -->
            <div class="col-lg-8">
                <!-- 问题输入 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-search"></i> 提问</h3>
                        <div class="input-group">
                            <input type="text" id="question-input" class="form-control form-control-lg" 
                                   placeholder="请输入您的问题，例如：孔子认为什么是仁？" 
                                   maxlength="200">
                            <button id="submit-btn" class="btn btn-primary btn-lg">
                                <i class="fas fa-paper-plane"></i> 提问
                            </button>
                        </div>
                        <div id="loading" class="loading-spinner text-center mt-3">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">检索中...</span>
                            </div>
                            <p class="mt-2">正在检索知识库...</p>
                        </div>
                    </div>
                </div>

                <!-- 问题历史 -->
                <div class="card mb-4" id="history-card" style="display: none;">
                    <div class="card-body">
                        <h4 class="card-title"><i class="fas fa-history"></i> 问题历史</h4>
                        <div id="history-list" class="list-group"></div>
                    </div>
                </div>

                <!-- 答案展示 -->
                <div class="card mb-4 answer-card" id="answer-card" style="display: none;">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-lightbulb"></i> 答案</h3>
                        <p id="answer-content" class="fs-4 mb-3"></p>
                        <span id="answer-source" class="source-tag"></span>
                    </div>
                </div>

                <!-- 相关知识 -->
                <div class="card" id="sources-card" style="display: none;">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-book"></i> 相关知识</h3>
                        <div id="sources-list"></div>
                    </div>
                </div>
            </div>

            <!-- 右侧信息栏 -->
            <div class="col-lg-4">
                <!-- 知识库统计 -->
                <div class="card mb-4" id="knowledge">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-database"></i> 知识库内容</h3>
                        <div id="category-list" class="row row-cols-3 gap-2"></div>
                        <div class="mt-4 p-3 bg-light rounded-lg">
                            <div class="text-center">
                                <div id="total-count" class="text-3xl font-bold text-primary">0</div>
                                <div class="text-sm text-muted">总段落数</div>
                            </div>
                        </div>
                    </div>
                </div></function></seed:tool_call>

                <!-- 热门问题 -->
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-fire"></i> 热门问题</h3>
                        <ul id="hot-questions" class="list-group list-group-flush"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- 关于 -->
        <div class="row mt-5" id="about">
            <div class="col">
                <div class="card">
                    <div class="card-body text-center">
                        <h3 class="card-title"><i class="fas fa-info-circle"></i> 关于系统</h3>
                        <p class="card-text">本系统是一个基于BM25检索算法的开放领域问答系统，旨在为用户提供中国古典文学知识的问答服务。</p>
                        <p class="card-text text-muted">基于 Flask + Bootstrap 构建</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>© 2024 中国古典文学问答系统 | 基于 BM25 检索技术</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const questionInput = document.getElementById('question-input');
        const submitBtn = document.getElementById('submit-btn');
        const loadingDiv = document.getElementById('loading');
        const answerCard = document.getElementById('answer-card');
        const sourcesCard = document.getElementById('sources-card');
        const historyCard = document.getElementById('history-card');
        const historyList = document.getElementById('history-list');
        const hotQuestions = document.getElementById('hot-questions');
        const questionHistory = [];

        const categoryList = document.getElementById('category-list');
        const totalCount = document.getElementById('total-count');
        const colors = ['bg-primary', 'bg-success', 'bg-warning', 'bg-danger', 'bg-info', 'bg-dark', 'bg-secondary', 'bg-primary', 'bg-success', 'bg-warning', 'bg-danger', 'bg-info', 'bg-dark', 'bg-secondary', 'bg-primary'];

        fetch('/api/statistics?cache_bust=' + Date.now())
            .then(res => res.json())
            .then(data => {
                totalCount.textContent = data.total_docs;
                
                let colorIndex = 0;
                Object.entries(data.categories).forEach(([name, count]) => {
                    const div = document.createElement('div');
                    div.className = `category-card ${colors[colorIndex % colors.length]} text-white rounded-lg p-3 text-center`;
                    div.innerHTML = `<div class="text-2xl">${count}</div><div class="text-sm">${name}</div>`;
                    categoryList.appendChild(div);
                    colorIndex++;
                });

                data.hot_questions.forEach(q => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item history-item';
                    li.innerHTML = `<i class="fas fa-chevron-right mr-2"></i>${q}`;
                    li.addEventListener('click', () => {
                        questionInput.value = q;
                        submitQuestion();
                    });
                    hotQuestions.appendChild(li);
                });
            });

        // 提交问题
        submitBtn.addEventListener('click', submitQuestion);
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitQuestion();
        });

        function submitQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            // 显示加载状态
            loadingDiv.style.display = 'block';
            answerCard.style.display = 'none';
            sourcesCard.style.display = 'none';

            // 发送请求
            fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            })
            .then(res => res.json())
            .then(data => {
                loadingDiv.style.display = 'none';
                
                // 更新答案
                document.getElementById('answer-content').textContent = data.answer || '未找到相关答案';
                document.getElementById('answer-source').textContent = data.source || '未知来源';
                answerCard.style.display = 'block';
                answerCard.classList.add('fade-in');

                // 更新相关知识
                const sourcesList = document.getElementById('sources-list');
                sourcesList.innerHTML = '';
                data.sources.forEach((source, index) => {
                    const div = document.createElement('div');
                    div.className = 'border-bottom pb-3 mb-3 last:border-0 last:mb-0';
                    div.innerHTML = `
                        <h5><strong>${index + 1}. ${source.title}</strong></h5>
                        <p class="text-muted">${source.content}</p>
                        ${source.answer ? `<p><small class="text-primary">抽取答案：${source.answer} (置信度: ${(source.answer_score * 100).toFixed(0)}%)</small></p>` : ''}
                    `;
                    sourcesList.appendChild(div);
                });
                sourcesCard.style.display = 'block';
                sourcesCard.classList.add('fade-in');

                // 添加到历史记录
                if (!questionHistory.includes(question)) {
                    questionHistory.unshift(question);
                    if (questionHistory.length > 5) questionHistory.pop();
                    updateHistory();
                }
            })
            .catch(err => {
                loadingDiv.style.display = 'none';
                alert('检索失败，请重试');
            });
        }

        function updateHistory() {
            historyList.innerHTML = '';
            questionHistory.forEach(q => {
                const item = document.createElement('button');
                item.className = 'list-group-item list-group-item-action history-item text-left';
                item.innerHTML = `<i class="fas fa-history mr-2"></i>${q}`;
                item.addEventListener('click', () => {
                    questionInput.value = q;
                    submitQuestion();
                });
                historyList.appendChild(item);
            });
            historyCard.style.display = questionHistory.length > 0 ? 'block' : 'none';
        }
    </script>
</body>
</html>
